# ==============================================================================
# Bicep Deploy  (the "terraform apply" of this repo)
# Automatic: starts when "Bicep What-If" finishes. Deploys ONLY when
#   * the what-if run succeeded, on main, triggered by a push (never a PR)
#   * a reviewer approves the 'prod' environment
# Manual   : Actions -> Bicep Deploy -> Run workflow (choose the stack; main only).
#            Run "Bicep What-If" for the same stack first and review it.
#
# It deploys the exact COMMIT that was previewed. ARM re-evaluates at deploy
# time (there is no saved plan), and every deployment is idempotent.
# ==============================================================================
name: Bicep Deploy

on:
  workflow_run:
    workflows: ["Bicep What-If"]
    types: [completed]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        options: [primary-centralindia, secondary-southindia]
        default: primary-centralindia

permissions:
  contents: read
  id-token: write

concurrency:
  group: bicep-deploy-${{ inputs.stack || 'primary-centralindia' }}
  cancel-in-progress: false   # never interrupt a running deployment

env:
  STACK: ${{ inputs.stack || 'primary-centralindia' }}
  BICEP_VERSION: ${{ vars.BICEP_VERSION }}

jobs:
  deploy:
    name: deploy (${{ inputs.stack || 'primary-centralindia' }})
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: prod              # <- pauses here for the required reviewer
    timeout-minutes: 120
    env:
      ALZ_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ALZ_SUB_GOVERNANCE: ${{ vars.ALZ_SUB_GOVERNANCE }}
      ALZ_SUB_HUB: ${{ vars.ALZ_SUB_HUB }}
      ALZ_SUB_IDENTITY: ${{ vars.ALZ_SUB_IDENTITY }}
      ALZ_SUB_WORKLOAD: ${{ vars.ALZ_SUB_WORKLOAD }}
    steps:
      # workflow_run runs on the latest main: check out the commit that was PREVIEWED
      - name: Checkout the previewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Link to the reviewed what-if
        if: github.event_name == 'workflow_run'
        run: |
          {
            echo "## Deploying \`${STACK}\`"
            echo "Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "Reviewed what-if: ${{ github.event.workflow_run.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Bicep CLI ${{ env.BICEP_VERSION }}
        run: |
          curl -fsSLo bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep

      - name: Install Az PowerShell modules
        shell: pwsh
        run: Install-Module Az.Accounts, Az.Resources, Az.KeyVault -Scope CurrentUser -Force -Repository PSGallery

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.ALZ_SUB_GOVERNANCE }}
          enable-AzPSSession: true

      - name: Deploy (${{ env.STACK }})
        shell: pwsh
        run: ./scripts/Deploy-LandingZone.ps1 -Stack $env:STACK -Mode Deploy -Force
