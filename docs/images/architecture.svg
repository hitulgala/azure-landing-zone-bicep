<text x="800.0" y="42" font-size="24" font-weight="bold" text-anchor="middle" fill="#212121">Azure Landing Zone (Bicep): hub and spoke, two regions, four subscriptions</text>
<text x="800.0" y="68" font-size="14" font-weight="normal" text-anchor="middle" fill="#546e7a">Deployed as one subscription-scope deployment per region, from a laptop or GitHub Actions</text>
