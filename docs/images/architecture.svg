<text x="1110" y="163" font-size="13" font-weight="normal" text-anchor="start" fill="#37474f">pre-flight checks, password from Key Vault,</text>
<text x="1110" y="182" font-size="13" font-weight="normal" text-anchor="start" fill="#37474f">what-if, confirm, deploy (Az PowerShell)</text>
