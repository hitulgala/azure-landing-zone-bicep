<text x="60" y="163" font-size="13" font-weight="normal" text-anchor="start" fill="#37474f">prod environment approval (required reviewer)</text>
<text x="60" y="182" font-size="13" font-weight="normal" text-anchor="start" fill="#37474f">Bicep Deploy: same commit, outputs in run Summary</text>
